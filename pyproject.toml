[project]
name = "personal-agent-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Topgyal Gurung", email = "topgyaltsering3@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "litellm>=1.106.6",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
personal-agent-app = "personal_agent_app:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]
