<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Agent</title>
  <style>
    :root { color-scheme: light dark; --accent: #2f6fed; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: flex; flex-direction: column;
           font: 14px/1.45 -apple-system, BlinkMacSystemFont, sans-serif; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex;
                flex-direction: column; gap: 10px; }
    .msg { max-width: 85%; padding: 8px 12px; border-radius: 12px;
           white-space: pre-wrap; overflow-wrap: anywhere; }
    .user { align-self: flex-end; background: var(--accent); color: #fff; }
    .agent { align-self: flex-start; background: rgba(127,127,127,.18); }
    .error { align-self: flex-start; background: rgba(220,50,50,.18); }
    .meta { font-size: 11px; opacity: .6; margin-top: 4px; }
    form { display: flex; gap: 8px; padding: 12px;
           border-top: 1px solid rgba(127,127,127,.3); }
    input { flex: 1; padding: 8px 10px; font: inherit; border-radius: 8px;
            border: 1px solid rgba(127,127,127,.4); background: transparent;
            color: inherit; }
    button { padding: 8px 14px; font: inherit; border-radius: 8px; border: 0;
             background: var(--accent); color: #fff; cursor: pointer; }
    button:disabled, input:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <div id="messages" role="log" aria-live="polite">
    <div class="msg agent">Ask about your calendar, email, or notes.</div>
  </div>
  <form id="form">
    <input id="input" autocomplete="off" autofocus
           placeholder="What's my day look like?" aria-label="Message">
    <button id="send" type="submit">Send</button>
  </form>
  <script>
    const messages = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");

    function add(kind, text, meta) {
      const div = document.createElement("div");
      div.className = "msg " + kind;
      div.textContent = text;
      if (meta) {
        const small = document.createElement("div");
        small.className = "meta";
        small.textContent = meta;
        div.appendChild(small);
      }
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      add("user", text);
      input.value = "";
      input.disabled = send.disabled = true;
      const loading = add("agent", "Thinking…");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        });
        if (!response.ok) throw new Error("Request failed (" + response.status + ")");
        const data = await response.json();
        loading.remove();
        if (data.error) {
          add("error", data.error);
        } else {
          const used = data.tools.length ? "Used: " + data.tools.join(", ") : "";
          add("agent", data.text, used);
        }
      } catch (error) {
        loading.remove();
        add("error", "Couldn't reach the app: " + error.message);
      } finally {
        input.disabled = send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
